services:
  postgres:
    image: postgres:16
    container_name: leaks-api-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - leaks_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: aaronmartinezg/aguafix-api:latest
    container_name: aguafix-migrations
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    command: ["npx", "typeorm", "-d", "dist/db/data-source.js", "migration:run"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: aaronmartinezg/aguafix-api:latest
    container_name: aguafix-api
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  leaks_db_data: